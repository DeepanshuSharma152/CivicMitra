<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Complaints List - CivicMitra</title>
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4" th:text="${viewTitle}">📝 Complaints List</h1>

    <div sec:authorize="hasRole('CITIZEN')">
        <a th:href="@{/complaints/new}" class="btn btn-primary mb-3">+ Create New Complaint</a>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th sec:authorize="hasRole('AUTHORITY')">Reported By</th> <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${complaints}">
            <td th:text="${c.complaintId}"></td>
            <td th:text="${c.title}"></td>

            <td sec:authorize="hasRole('AUTHORITY')" th:text="${c.user.fullName}"></td>

            <td>
                    <span th:classappend="${c.status.name() == 'PENDING' ? 'badge bg-warning' : 'badge bg-success'}"
                          th:text="${c.status.displayName}"></span>
            </td>

            <td>
                <a th:href="@{/complaints/{id}(id=${c.complaintId})}" class="btn btn-sm btn-info">View</a>

                <a sec:authorize="hasRole('CITIZEN')"
                   th:href="@{/complaints/{id}/edit(id=${c.complaintId})}"
                   class="btn btn-sm btn-warning">Edit</a>

                <a sec:authorize="hasRole('AUTHORITY')"
                   th:href="@{/complaints/{id}/resolve(id=${c.complaintId})}"
                   class="btn btn-sm btn-success">Mark Resolved</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
