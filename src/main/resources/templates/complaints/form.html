<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${complaint.complaintId != null} ? 'Edit Complaint' : 'Create Complaint'">
        Create Complaint
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 th:text="${complaint.complaintId != null} ? 'Edit Complaint' : 'Create New Complaint'">
        Create New Complaint
    </h1>

    <!-- Form -->
    <form th:action="@{${action}}" th:object="${complaint}" method="post" class="mt-4">

        <!-- Hidden ID field for updates -->
        <input type="hidden" th:field="*{complaintId}">

        <div class="mb-3">
            <label for="title" class="form-label">Title *</label>
            <input type="text" class="form-control" id="title" th:field="*{title}"
                   required minlength="5" maxlength="200">
            <div class="form-text">Enter a descriptive title (5-200 characters)</div>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description *</label>
            <textarea class="form-control" id="description" th:field="*{description}"
                      rows="4" required></textarea>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category" th:field="*{category}">
                    <option value="">Select Category</option>
                    <option value="Water">💧 Water</option>
                    <option value="Electricity">⚡ Electricity</option>
                    <option value="Road">🛣️ Road</option>
                    <option value="Sanitation">🗑️ Sanitation</option>
                    <option value="Other">❓ Other</option>
                </select>
            </div>

            <div class="col-md-4 mb-3">
                <label for="location" class="form-label">Location</label>
                <input type="text" class="form-control" id="location" th:field="*{location}">
            </div>

            <div class="col-md-4 mb-3">
                <label for="district" class="form-label">District</label>
                <input type="text" class="form-control" id="district" th:field="*{district}">
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="state" class="form-label">State</label>
                <input type="text" class="form-control" id="state" th:field="*{state}">
            </div>

            <div class="col-md-6 mb-3">
                <label for="status" class="form-label">Status</label>
                <select class="form-select" id="status" th:field="*{status}">
                    <option th:each="status : ${T(com.example.CivicMitra.model.ComplaintStatus).values()}"
                            th:value="${status}"
                            th:text="${status.displayName}">
                        PENDING
                    </option>
                </select>
            </div>
        </div>

        <!-- Form buttons -->
        <div class="mt-4">
            <button type="submit" class="btn btn-primary">
                <span th:text="${complaint.complaintId != null} ? 'Update' : 'Create'">Create</span>
            </button>
            <a th:href="@{/complaints}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
