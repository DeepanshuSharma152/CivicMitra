<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${complaint.title}">Complaint Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-badge {
            font-size: 0.9em;
            padding: 5px 10px;
        }
        .detail-card {
            border-left: 4px solid #0d6efd;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <!-- Back button -->
    <a th:href="@{/complaints}" class="btn btn-outline-secondary mb-4">← Back to List</a>

    <!-- Complaint Card -->
    <div class="card detail-card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4 class="mb-0" th:text="${complaint.title}">Complaint Title</h4>
            <div>
                <span th:classappend="${complaint.status.name() == 'PENDING' ? 'badge bg-warning' :
                                      complaint.status.name() == 'RESOLVED' ? 'badge bg-success' :
                                      'badge bg-secondary'}"
                      class="badge status-badge" th:text="${complaint.status.displayName}">
                    PENDING
                </span>
            </div>
        </div>
        <div class="card-body">
            <!-- Description -->
            <div class="mb-4">
                <h6>Description</h6>
                <p class="card-text" th:text="${complaint.description}">
                    Description here...
                </p>
            </div>

            <!-- Details in grid -->
            <div class="row">
                <div class="col-md-6">
                    <table class="table table-sm">
                        <tr>
                            <th width="40%">ID:</th>
                            <td th:text="${complaint.complaintId}">123</td>
                        </tr>
                        <tr>
                            <th>Category:</th>
                            <td>
                                <span class="badge bg-info" th:text="${complaint.category}">
                                    Water
                                </span>
                            </td>
                        </tr>
                        <tr>
                            <th>Location:</th>
                            <td th:text="${complaint.location}">Sector 17</td>
                        </tr>
                    </table>
                </div>
                <div class="col-md-6">
                    <table class="table table-sm">
                        <tr>
                            <th width="40%">District:</th>
                            <td th:text="${complaint.district}">Mohali</td>
                        </tr>
                        <tr>
                            <th>State:</th>
                            <td th:text="${complaint.state}">Punjab</td>
                        </tr>
                        <tr>
                            <th>Created:</th>
                            <td th:text="${#temporals.format(complaint.createdAt, 'dd-MMM-yyyy HH:mm')}">
                                01-Jan-2023 10:30
                            </td>
                        </tr>
                        <tr>
                            <th>Last Updated:</th>
                            <td th:text="${#temporals.format(complaint.updatedAt, 'dd-MMM-yyyy HH:mm')}">
                                01-Jan-2023 10:30
                            </td>
                        </tr>
                    </table>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="mt-4 pt-3 border-top">
                <a th:href="@{/complaints/{id}/edit(id=${complaint.complaintId})}"
                   class="btn btn-warning">Edit</a>
                <a th:href="@{/complaints/{id}/delete(id=${complaint.complaintId})}"
                   class="btn btn-danger"
                   onclick="return confirm('Are you sure you want to delete this complaint?')">
                    Delete
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
