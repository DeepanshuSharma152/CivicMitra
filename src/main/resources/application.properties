spring.application.name=CivicMitra
spring.profiles.active=dev
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/civicmitra}
spring.datasource.username=root
spring.datasource.password=JAVA@20@25_
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.security.user.name=deep
#spring.security.user.password=deep
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.hibernate.resource.transaction=DEBUG
# AI provider configuration
# Set GROQ_API_KEY as an environment variable or in application-local.properties (never commit real keys)
groq.api.key=${GROQ_API_KEY:your-groq-api-key-here}
spring.ai.openai.api-key=dummy
