spring.application.name=CivicMitra
spring.profiles.active=dev
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/civicmitra}
spring.datasource.username=root
spring.datasource.password=JAVA@20@25_
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.security.user.name=deep
#spring.security.user.password=deep
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.hibernate.resource.transaction=DEBUG
# AI provider configuration
# Set GROQ_API_KEY as an environment variable or in application-local.properties (never commit real keys)
groq.api.key=${GROQ_API_KEY:your_groq_api_key_here}
spring.ai.openai.api-key=${groq.api.key}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=qwen/qwen3.6-27b

# OpenRouter — free vision model (google/gemini-2.0-flash-exp:free) for waste image analysis
# No thinking-mode, generous free tier. Get key at: https://openrouter.ai
openrouter.api.key=${OPENROUTER_API_KEY:your_openrouter_api_key_here}

ollama.base-url=http://localhost:11434
ollama.model=gemma3:4b
