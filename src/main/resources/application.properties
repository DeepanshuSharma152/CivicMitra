spring.application.name=CivicMitra
spring.profiles.active=dev
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/civicmitra}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:JAVA@20@25_}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
#spring.security.user.name=deep
#spring.security.user.password=deep
logging.level.org.springframework.orm.jpa=WARN
logging.level.org.hibernate.resource.transaction=WARN
# AI provider configuration
# Set GROQ_API_KEY as an environment variable or in application-local.properties (never commit real keys)
groq.api.key=${GROQ_API_KEY:your_groq_api_key_here}
spring.ai.openai.api-key=${groq.api.key}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=qwen/qwen3.6-27b

# OpenRouter — free vision model (google/gemini-2.0-flash-exp:free) for waste image analysis
# No thinking-mode, generous free tier. Get key at: https://openrouter.ai
openrouter.api.key=${OPENROUTER_API_KEY:your_openrouter_api_key_here}

ollama.base-url=http://localhost:11434
ollama.model=gemma3:4b

# ── AI Demo Mode ──────────────────────────────────────────────────────────────
# Set to true to skip real Ollama/Gemma inference and return instant APPROVED result.
# Photos still upload, DB row still created, QR still generated — only AI call is mocked.
# Switch to false for real inference in production.
civicmitra.ai.demo-mode=true

# ── App base URL (used to build QR code scan links) ──────────────────────────
# Set to your machine's LAN IP so phone cameras open the worker page on scan.
# Change this whenever your IP changes. localhost only works on the same machine.
civicmitra.app.base-url=${APP_BASE_URL:http://localhost:3000}
